name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  critical-journeys:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_COMPOSITION: local
      HFT_CRITICAL_E2E: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev
      - run: npx playwright install --with-deps chromium firefox webkit
      # Development composition exposes only local fixture identity controls.
      # Chromium runs every selected spec; Firefox/WebKit run the tagged core journeys.
      - name: Household, Expense, Settlement, Card, mobile layout, and glass navigation journeys
        run: npx playwright test tests/e2e/household-onboarding.spec.ts tests/e2e/household-management.spec.ts tests/e2e/expenses.spec.ts tests/e2e/settlements.spec.ts tests/e2e/cards.spec.ts tests/e2e/ui-redesign.spec.ts tests/e2e/mobile-layout.spec.ts tests/e2e/glass-navigation.spec.ts --workers=2 --retries=0
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: critical-journey-failures
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  session-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_COMPOSITION: appwrite
      SESSION_RESILIENCE_E2E: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run build
      # Every API operation is intercepted with fixtures: no production credentials or mutations.
      - run: npx playwright test tests/e2e/session-resilience.spec.ts --workers=2

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Hermetic production build: composition defaults to local; no Appwrite
      # or auth secrets are ever present in CI.
      APP_COMPOSITION: local
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # NODE_ENV=production keeps the build hermetic, but verification still
        # needs the repository's lint, typecheck, and test toolchain.
        run: npm ci --include=dev

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit, integration, and architecture tests
        run: npm test

      - name: Production build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Dependency audit
        run: npm audit --audit-level=high
        continue-on-error: false

      - name: Whitespace check
        if: github.event_name == 'pull_request'
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          git diff --check "$BASE" HEAD || {
            echo "Whitespace errors detected."; exit 1;
          }
