name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Hermetic production build: composition defaults to local; no Appwrite
      # or auth secrets are ever present in CI.
      APP_COMPOSITION: local
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # NODE_ENV=production keeps the build hermetic, but verification still
        # needs the repository's lint, typecheck, and test toolchain.
        run: npm ci --include=dev

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit, integration, and architecture tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Dependency audit
        run: npm audit --audit-level=high
        continue-on-error: false

      - name: Whitespace check
        if: github.event_name == 'pull_request'
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          git diff --check "$BASE" HEAD || {
            echo "Whitespace errors detected."; exit 1;
          }
